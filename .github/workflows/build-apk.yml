name: Build TeleCloud Native Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build TeleCloud APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare APK for Release
        run: |
          mkdir -p release-output
          cp app/build/outputs/apk/debug/app-debug.apk release-output/TeleCloud-v1.0.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TeleCloud-v1.0.0-APK
          path: release-output/TeleCloud-v1.0.0.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.0
          name: "TeleCloud v1.0.0 - Smart Cloud Media Player & Downloader"
          body: |
            ### ⚡ TeleCloud v1.0.0: Smart Cloud Media Player & Downloader Android APK

            - **Native Storage Downloads & Permissions:**
              - Saves downloaded media directly to Android's storage (`/sdcard/Download/`).
              - Native Android `DownloadManager` integration with background downloads & status bar notifications.
              - Export offline cached IndexedDB media directly to public storage without re-downloading.
            - **Modern High-Performance Web Engine:**
              - Built with `WebViewAssetLoader` serving local assets securely.
              - Hardware-accelerated GPU layer with smooth streaming playback.
              - Cleartext traffic and mixed-content support for direct high-speed HTTP cloud streaming.
            - **Native Device Features:**
              - Fullscreen video playback with automated status bar hide/restore.
              - Deep Space Navy dark theme `#080C16`.
              - Custom Cloud & Stream vector launcher icons.
              - Double back-tap navigation.
          files: release-output/TeleCloud-v1.0.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
