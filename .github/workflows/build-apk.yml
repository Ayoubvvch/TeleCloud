name: Build TeleCloud Native Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Signed TeleCloud APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Signed Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare APK for Release
        run: |
          mkdir -p release-output
          cp app/build/outputs/apk/release/app-release.apk release-output/TeleCloud-v2.2.2.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TeleCloud-v2.2.2-APK
          path: release-output/TeleCloud-v2.2.2.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v2.2.2
          name: "TeleCloud v2.2.2 - Authenticated Video Streaming & Cookie Interceptor"
          body: |
            ### ⚡ TeleCloud v2.2.2: Native Stream Interceptor, Range Request Forwarding & Seamless Streaming

            - **Persistent Cryptographic Signing:**
              - Officially signed with a permanent release keystore.
              - In-place updates: No more uninstalling previous versions to update!
            - **100% Modern English UI (AMOLED Dark):**
              - Clean internationalized English interface with improved typography.
              - Intuitive controls, category filters, and live search.
            - **In-App Update Engine:**
              - Added "Check for Updates" directly inside Settings modal.
              - Automated comparison with GitHub Releases API.
              - Direct 1-tap download and update installation.
            - **Performance & Security Hardening:**
              - Hardware-accelerated video streaming engine.
              - Strict URL scheme validation (`http`, `https`, `tg`) to protect against intent redirection.
              - Sanitized input and filename handling for downloads.
              - Android `DownloadManager` integration with background notifications.
              - External player dispatch (VLC, MX Player) supported natively.
          files: release-output/TeleCloud-v2.2.2.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
