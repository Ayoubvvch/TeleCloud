<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TeleCloud - مشغل ومحمل سحابي فائق السرعة</title>
  <style>
    :root {
      --bg-base: #080c14;
      --bg-surface: #0f172a;
      --bg-card: #131c31;
      --bg-card-hover: #1b2742;
      --bg-active: #0c2d48;
      --border: rgba(255, 255, 255, 0.08);
      --border-focus: #0284c7;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --accent: #0284c7;
      --accent-light: #38bdf8;
      --emerald: #10b981;
      --danger: #ef4444;
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Cairo", "Tajawal", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-base);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      user-select: none;
    }

    /* Top App Header */
    header {
      background-color: var(--bg-surface);
      border-bottom: 1px solid var(--border);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-shrink: 0;
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 800;
      font-size: 17px;
      color: #fff;
      letter-spacing: -0.3px;
    }

    .brand-icon {
      width: 30px;
      height: 30px;
      border-radius: var(--radius-sm);
      background: linear-gradient(135deg, #0284c7, #0369a1);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 16px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .server-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.3);
      border-radius: 20px;
      font-size: 11.5px;
      color: #34d399;
      font-weight: 600;
    }

    .server-pill.offline {
      background: rgba(239, 68, 68, 0.12);
      border-color: rgba(239, 68, 68, 0.3);
      color: #f87171;
    }

    .server-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--emerald);
    }
    .server-pill.offline .server-dot {
      background: var(--danger);
    }

    .icon-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      color: var(--text-main);
      width: 34px;
      height: 34px;
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.15s;
    }
    .icon-btn:active {
      background: rgba(255, 255, 255, 0.15);
    }

    /* Main Container */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    /* Player Container */
    .player-section {
      background: #000;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      border-bottom: 1px solid var(--border);
      z-index: 5;
    }

    .video-wrapper {
      position: relative;
      width: 100%;
      background: #000;
      max-height: 40vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    video {
      width: 100%;
      max-height: 40vh;
      display: block;
      outline: none;
      background: #000;
    }

    .player-placeholder {
      padding: 30px 16px;
      text-align: center;
      color: var(--text-dim);
      font-size: 13.5px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .player-placeholder svg {
      opacity: 0.4;
    }

    /* Player Info & Quick Controls Bar */
    .player-bar {
      background: var(--bg-surface);
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .now-playing-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .now-playing-info {
      flex: 1;
      min-width: 0;
    }

    .now-playing-title {
      font-size: 13.5px;
      font-weight: 700;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .now-playing-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 3px;
      font-size: 11px;
      color: var(--text-muted);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      padding: 2px 7px;
      border-radius: var(--radius-sm);
      font-size: 10.5px;
      font-weight: 600;
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-muted);
    }
    .badge.cyan {
      background: rgba(2, 132, 199, 0.18);
      color: var(--accent-light);
      border: 1px solid rgba(2, 132, 199, 0.3);
    }

    /* Player Action Buttons Strip */
    .player-controls {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 2px;
      scrollbar-width: none;
    }
    .player-controls::-webkit-scrollbar {
      display: none;
    }

    .ctrl-btn {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text-main);
      padding: 6px 12px;
      font-size: 11.5px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    .ctrl-btn:active {
      background: var(--bg-card-hover);
    }
    .ctrl-btn.active {
      background: rgba(2, 132, 199, 0.25);
      border-color: var(--accent-light);
      color: var(--accent-light);
    }
    .ctrl-btn.emerald {
      background: rgba(16, 185, 129, 0.15);
      border-color: rgba(16, 185, 129, 0.35);
      color: #34d399;
    }
    .ctrl-btn.emerald:active {
      background: rgba(16, 185, 129, 0.3);
    }

    /* Explorer / Playlist Section */
    .content-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Filter & Search Bar */
    .filter-bar {
      background: var(--bg-base);
      padding: 10px 14px 6px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-shrink: 0;
    }

    .search-box {
      position: relative;
      display: flex;
      align-items: center;
      width: 100%;
    }

    .search-input {
      width: 100%;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 8px 36px 8px 32px;
      color: #fff;
      font-size: 13px;
      outline: none;
      transition: border-color 0.15s;
    }
    .search-input:focus {
      border-color: var(--border-focus);
    }
    .search-input::placeholder {
      color: var(--text-dim);
    }

    .search-icon-svg {
      position: absolute;
      right: 12px;
      color: var(--text-dim);
      pointer-events: none;
    }

    .search-clear-btn {
      position: absolute;
      left: 10px;
      background: none;
      border: none;
      color: var(--text-dim);
      font-size: 14px;
      cursor: pointer;
      display: none;
      padding: 2px 6px;
    }

    /* Folder Chips */
    .chips-wrapper {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      padding: 2px 0 6px 0;
      scrollbar-width: none;
    }
    .chips-wrapper::-webkit-scrollbar {
      display: none;
    }

    .chip {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      color: var(--text-muted);
      padding: 4px 12px;
      font-size: 11.5px;
      font-weight: 500;
      white-space: nowrap;
      cursor: pointer;
    }
    .chip.active {
      background: var(--accent);
      border-color: var(--accent-light);
      color: #fff;
      font-weight: 700;
    }

    /* Video List */
    .items-container {
      flex: 1;
      overflow-y: auto;
      padding: 8px 14px 24px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .video-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      cursor: pointer;
      transition: background 0.12s, border-color 0.12s;
    }
    .video-card:active {
      background: var(--bg-card-hover);
    }
    .video-card.playing {
      background: var(--bg-active);
      border-color: var(--accent-light);
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.15);
    }

    .card-info {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .card-title {
      font-size: 13px;
      font-weight: 600;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      direction: ltr;
      text-align: right;
    }

    .card-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      color: var(--text-dim);
    }

    .card-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .card-btn {
      border: none;
      border-radius: var(--radius-sm);
      padding: 7px 11px;
      font-size: 11.5px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
    }

    .card-btn.play {
      background: rgba(2, 132, 199, 0.18);
      color: var(--accent-light);
      border: 1px solid rgba(2, 132, 199, 0.35);
    }
    .card-btn.play:active {
      background: var(--accent);
      color: #fff;
    }

    .card-btn.download {
      background: rgba(16, 185, 129, 0.12);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.28);
    }
    .card-btn.download:active {
      background: var(--emerald);
      color: #fff;
    }

    /* Empty / Status State */
    .empty-state {
      padding: 50px 20px;
      text-align: center;
      color: var(--text-dim);
      font-size: 13px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    /* Toast Notification */
    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid var(--border);
      color: #fff;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 12.5px;
      font-weight: 500;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
      z-index: 99;
      pointer-events: none;
      transition: opacity 0.2s;
    }

    /* Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 100;
    }
    .modal-backdrop.open {
      display: flex;
    }
    .modal-content {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      width: 100%;
      max-width: 380px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .modal-title {
      font-size: 15px;
      font-weight: 700;
      color: #fff;
    }
    .modal-input {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 9px 12px;
      color: #fff;
      font-size: 13px;
      outline: none;
      direction: ltr;
    }
    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }
    .btn {
      padding: 7px 14px;
      border-radius: var(--radius-md);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: #fff;
    }
    .btn.primary {
      background: var(--accent);
      border-color: var(--accent-light);
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="brand">
      <div class="brand-icon">⚡</div>
      <span>TeleCloud</span>
    </div>
    <div class="header-actions">
      <div class="server-pill" id="serverPill" title="حالة الاتصال">
        <span class="server-dot"></span>
        <span id="serverStatusText">جاري الاتصال...</span>
      </div>
      <button class="icon-btn" id="refreshBtn" title="تحديث القائمة">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="23 4 23 10 17 10"></polyline>
          <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
        </svg>
      </button>
      <button class="icon-btn" id="settingsBtn" title="إعدادات السيرفر">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>
    </div>
  </header>

  <!-- Main Body -->
  <main>
    <!-- Video Player Section -->
    <section class="player-section" id="playerSection">
      <div class="video-wrapper">
        <video id="mainPlayer" controls playsinline preload="metadata" style="display:none;"></video>
        <div class="player-placeholder" id="playerPlaceholder">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="5 3 19 12 5 21 5 3"></polygon>
          </svg>
          <span>اختر مقطعاً للبدء بالمشاهدة المباشرة فائقة السرعة</span>
        </div>
      </div>

      <!-- Quick Player Action Bar -->
      <div class="player-bar" id="playerBar" style="display:none;">
        <div class="now-playing-row">
          <div class="now-playing-info">
            <div class="now-playing-title" id="nowPlayingTitle">العنوان</div>
            <div class="now-playing-meta">
              <span class="badge cyan" id="nowPlayingFolder">المجلد</span>
              <span class="badge" id="nowPlayingSize">0 MB</span>
            </div>
          </div>
        </div>

        <div class="player-controls">
          <button class="ctrl-btn active" id="loopBtn" title="تكرار المقطع">
            🔁 <span id="loopText">تكرار المقطع</span>
          </button>
          <button class="ctrl-btn" id="speedBtn" title="سرعة التشغيل">
            ⚡ <span id="speedText">1.0x</span>
          </button>
          <button class="ctrl-btn emerald" id="downloadCurrentBtn" title="تحميل هذا المقطع">
            ⬇️ تحميل
          </button>
          <button class="ctrl-btn" id="externalPlayerBtn" title="تشغيل في مشغل خارجي (VLC / MX)">
            🚀 مشغل خارجي
          </button>
          <button class="ctrl-btn" id="nextVideoBtn" title="المقطع التالي">
            ⏭️ التالي
          </button>
        </div>
      </div>
    </section>

    <!-- Content / Playlist Section -->
    <section class="content-section">
      <!-- Search & Filters -->
      <div class="filter-bar">
        <div class="search-box">
          <svg class="search-icon-svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="text" class="search-input" id="searchInput" placeholder="بحث سريع عن المقاطع أو المجلدات...">
          <button class="search-clear-btn" id="searchClearBtn">✕</button>
        </div>

        <div class="chips-wrapper" id="folderChips">
          <div class="chip active" data-folder="__all__">الكل (0)</div>
        </div>
      </div>

      <!-- Video Feed List -->
      <div class="items-container" id="itemsContainer">
        <div class="empty-state">
          <span>جاري تحميل المقاطع...</span>
        </div>
      </div>
    </section>
  </main>

  <!-- Server Settings Modal -->
  <div class="modal-backdrop" id="settingsModal">
    <div class="modal-content">
      <div class="modal-title">⚙️ عنوان سيرفر السحابة (Host)</div>
      <input type="text" class="modal-input" id="serverHostInput" placeholder="http://51.170.138.59:8080">
      <div class="modal-actions">
        <button class="btn" id="resetServerBtn">الافتراضي</button>
        <button class="btn" id="closeServerBtn">إلغاء</button>
        <button class="btn primary" id="saveServerBtn">حفظ وتحديث</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" style="display:none;"></div>

  <script>
    // --- Server Configuration ---
    const DEFAULT_DIRECT_SERVER = 'http://51.170.138.59:8080';
    const FALLBACK_PROXY_SERVER = 'https://ayoub314.vercel.app';

    function getSavedServer() {
      return localStorage.getItem('tc_server') || DEFAULT_DIRECT_SERVER;
    }

    let activeServer = getSavedServer();
    let allMediaItems = [];
    let filteredItems = [];
    let currentIndex = -1;
    let isLoopSingle = true;
    let currentSpeedIndex = 1;
    const playbackSpeeds = [0.75, 1.0, 1.25, 1.5, 2.0];
    let selectedFolder = '__all__';

    // DOM Elements
    const player = document.getElementById('mainPlayer');
    const playerPlaceholder = document.getElementById('playerPlaceholder');
    const playerBar = document.getElementById('playerBar');
    const nowPlayingTitle = document.getElementById('nowPlayingTitle');
    const nowPlayingFolder = document.getElementById('nowPlayingFolder');
    const nowPlayingSize = document.getElementById('nowPlayingSize');
    const loopBtn = document.getElementById('loopBtn');
    const loopText = document.getElementById('loopText');
    const speedBtn = document.getElementById('speedBtn');
    const speedText = document.getElementById('speedText');
    const downloadCurrentBtn = document.getElementById('downloadCurrentBtn');
    const externalPlayerBtn = document.getElementById('externalPlayerBtn');
    const nextVideoBtn = document.getElementById('nextVideoBtn');
    const searchInput = document.getElementById('searchInput');
    const searchClearBtn = document.getElementById('searchClearBtn');
    const folderChips = document.getElementById('folderChips');
    const itemsContainer = document.getElementById('itemsContainer');
    const serverPill = document.getElementById('serverPill');
    const serverStatusText = document.getElementById('serverStatusText');
    const refreshBtn = document.getElementById('refreshBtn');
    const settingsBtn = document.getElementById('settingsBtn');
    const settingsModal = document.getElementById('settingsModal');
    const serverHostInput = document.getElementById('serverHostInput');
    const resetServerBtn = document.getElementById('resetServerBtn');
    const closeServerBtn = document.getElementById('closeServerBtn');
    const saveServerBtn = document.getElementById('saveServerBtn');
    const toast = document.getElementById('toast');

    // Utility: Format File Size
    function formatBytes(bytes) {
      if (!bytes || bytes === 0) return '0 MB';
      const mb = bytes / (1024 * 1024);
      if (mb >= 1000) {
        return (mb / 1024).toFixed(2) + ' GB';
      }
      return mb.toFixed(1) + ' MB';
    }

    // Utility: Toast notification
    let toastTimeout = null;
    function showToast(message) {
      if (window.AndroidBridge && window.AndroidBridge.showToast) {
        window.AndroidBridge.showToast(message);
        return;
      }
      toast.textContent = message;
      toast.style.display = 'block';
      toast.style.opacity = '1';
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        toast.style.opacity = '0';
        setTimeout(() => toast.style.display = 'none', 200);
      }, 2500);
    }

    // Build Stream & Download URLs
    function getStreamUrl(item) {
      return `${activeServer}/api/tg-cloud/stream?path=${encodeURIComponent(item.path)}`;
    }

    function getDownloadUrl(item) {
      return `${activeServer}/api/tg-cloud/stream?path=${encodeURIComponent(item.path)}&download=1`;
    }

    // Playback Engine
    function playVideo(index) {
      if (index < 0 || index >= filteredItems.length) return;
      currentIndex = index;
      const item = filteredItems[index];

      // Update Player UI
      playerPlaceholder.style.display = 'none';
      player.style.display = 'block';
      playerBar.style.display = 'flex';

      nowPlayingTitle.textContent = item.name.replace(/\.[^/.]+$/, "");
      nowPlayingFolder.textContent = item.folder_name || 'الرئيسية';
      nowPlayingSize.textContent = formatBytes(item.size);

      // Stream source
      const streamUrl = getStreamUrl(item);
      player.src = streamUrl;
      player.playbackRate = playbackSpeeds[currentSpeedIndex];
      player.loop = isLoopSingle;

      player.play().catch(e => {
        console.warn('Auto-play caught:', e);
      });

      // Keep screen awake in Android
      if (window.AndroidBridge && window.AndroidBridge.setKeepScreenOn) {
        window.AndroidBridge.setKeepScreenOn(true);
      }

      updatePlayingCardHighlight();
    }

    // Update Highlight on Playlist Item
    function updatePlayingCardHighlight() {
      const currentItem = filteredItems[currentIndex];
      const cards = itemsContainer.querySelectorAll('.video-card');
      cards.forEach(card => {
        if (currentItem && card.dataset.path === currentItem.path) {
          card.classList.add('playing');
        } else {
          card.classList.remove('playing');
        }
      });
    }

    // Player Event Listeners
    player.addEventListener('play', () => {
      if (window.AndroidBridge && window.AndroidBridge.setKeepScreenOn) {
        window.AndroidBridge.setKeepScreenOn(true);
      }
    });

    player.addEventListener('pause', () => {
      if (window.AndroidBridge && window.AndroidBridge.setKeepScreenOn) {
        window.AndroidBridge.setKeepScreenOn(false);
      }
    });

    player.addEventListener('ended', () => {
      if (!isLoopSingle) {
        playNext();
      }
    });

    player.addEventListener('error', () => {
      console.warn('Player stream error encountered on server:', activeServer);
      // Auto fallback if direct server fails
      if (activeServer !== FALLBACK_PROXY_SERVER) {
        showToast('جاري التحويل التلقائي لخادم بديل...');
        activeServer = FALLBACK_PROXY_SERVER;
        serverStatusText.textContent = 'خادم بديل';
        if (currentIndex !== -1 && filteredItems[currentIndex]) {
          playVideo(currentIndex);
        }
      } else {
        showToast('تعذر تشغيل هذا المقطع');
      }
    });

    function playNext() {
      if (filteredItems.length === 0) return;
      let nextIndex = currentIndex + 1;
      if (nextIndex >= filteredItems.length) nextIndex = 0;
      playVideo(nextIndex);
    }

    function playPrev() {
      if (filteredItems.length === 0) return;
      let prevIndex = currentIndex - 1;
      if (prevIndex < 0) prevIndex = filteredItems.length - 1;
      playVideo(prevIndex);
    }

    // Quick Action Bar Handlers
    loopBtn.addEventListener('click', () => {
      isLoopSingle = !isLoopSingle;
      player.loop = isLoopSingle;
      if (isLoopSingle) {
        loopBtn.classList.add('active');
        loopText.textContent = 'تكرار المقطع';
        showToast('تم تفعيل تكرار المقطع 🔁');
      } else {
        loopBtn.classList.remove('active');
        loopText.textContent = 'تشغيل متتالي';
        showToast('تم تفعيل الانتقال التلقائي للتالي ⏭️');
      }
    });

    speedBtn.addEventListener('click', () => {
      currentSpeedIndex = (currentSpeedIndex + 1) % playbackSpeeds.length;
      const speed = playbackSpeeds[currentSpeedIndex];
      player.playbackRate = speed;
      speedText.textContent = speed + 'x';
      showToast(`سرعة التشغيل: ${speed}x ⚡`);
    });

    nextVideoBtn.addEventListener('click', () => {
      playNext();
    });

    downloadCurrentBtn.addEventListener('click', () => {
      if (currentIndex === -1 || !filteredItems[currentIndex]) return;
      downloadVideo(filteredItems[currentIndex]);
    });

    externalPlayerBtn.addEventListener('click', () => {
      if (currentIndex === -1 || !filteredItems[currentIndex]) return;
      const item = filteredItems[currentIndex];
      const url = getStreamUrl(item);
      if (window.AndroidBridge && window.AndroidBridge.openExternalPlayer) {
        window.AndroidBridge.openExternalPlayer(url, item.name);
      } else {
        window.open(url, '_blank');
      }
    });

    // Native Download Trigger
    function downloadVideo(item) {
      const dlUrl = getDownloadUrl(item);
      const filename = item.name || 'video.mp4';
      if (window.AndroidBridge && window.AndroidBridge.downloadFile) {
        window.AndroidBridge.downloadFile(dlUrl, filename);
      } else {
        window.open(dlUrl, '_blank');
        showToast('جاري بدء التحميل...');
      }
    }

    // Load Items from API
    async function fetchMedia() {
      serverPill.className = 'server-pill';
      serverStatusText.textContent = 'جاري الاتصال...';
      itemsContainer.innerHTML = '<div class="empty-state">جاري تحميل المقاطع...</div>';

      try {
        let res = null;
        try {
          res = await fetch(`${activeServer}/api/tg-cloud/category?type=video&_t=${Date.now()}`);
        } catch (e) {
          // If activeServer fails, try fallback proxy
          if (activeServer !== FALLBACK_PROXY_SERVER) {
            console.warn('Direct server unreachable, trying fallback proxy...');
            activeServer = FALLBACK_PROXY_SERVER;
            res = await fetch(`${activeServer}/api/tg-cloud/category?type=video&_t=${Date.now()}`);
          } else {
            throw e;
          }
        }

        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();

        if (data.success && Array.isArray(data.items)) {
          // Deduplicate items
          const seen = new Set();
          const list = [];
          for (const it of data.items) {
            const key = it.file_unique_id || it.channel_msg_id || it.path;
            if (!seen.has(key)) {
              seen.add(key);
              list.push(it);
            }
          }

          // Sort newest first by channel_msg_id
          list.sort((a, b) => {
            const midA = parseInt(a.channel_msg_id, 10) || 0;
            const midB = parseInt(b.channel_msg_id, 10) || 0;
            return midB - midA;
          });

          allMediaItems = list;
          serverPill.className = 'server-pill';
          serverStatusText.textContent = 'متصل';
          buildFolderChips();
          applyFilter();
        } else {
          throw new Error('قائمة فارغة');
        }
      } catch (err) {
        console.error('Fetch error:', err);
        serverPill.className = 'server-pill offline';
        serverStatusText.textContent = 'غير متصل';
        itemsContainer.innerHTML = `
          <div class="empty-state">
            <span>تعذر الاتصال بالسيرفر.</span>
            <button class="btn primary" onclick="fetchMedia()">إعادة المحاولة</button>
          </div>
        `;
      }
    }

    // Build Folder Chips
    function buildFolderChips() {
      const counts = {};
      allMediaItems.forEach(it => {
        const folder = it.folder_name || 'الرئيسية';
        counts[folder] = (counts[folder] || 0) + 1;
      });

      let html = `<div class="chip ${selectedFolder === '__all__' ? 'active' : ''}" data-folder="__all__">الكل (${allMediaItems.length})</div>`;
      Object.keys(counts).forEach(f => {
        html += `<div class="chip ${selectedFolder === f ? 'active' : ''}" data-folder="${escapeHtml(f)}">${escapeHtml(f)} (${counts[f]})</div>`;
      });

      folderChips.innerHTML = html;
      folderChips.querySelectorAll('.chip').forEach(chip => {
        chip.addEventListener('click', () => {
          selectedFolder = chip.dataset.folder;
          folderChips.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
          chip.classList.add('active');
          applyFilter();
        });
      });
    }

    // Filter Items by Folder and Search Input
    function applyFilter() {
      const query = (searchInput.value || '').trim().toLowerCase();

      filteredItems = allMediaItems.filter(item => {
        const matchFolder = (selectedFolder === '__all__') || ((item.folder_name || 'الرئيسية') === selectedFolder);
        if (!matchFolder) return false;

        if (!query) return true;
        const name = (item.name || '').toLowerCase();
        const caption = (item.caption || '').toLowerCase();
        const folder = (item.folder_name || '').toLowerCase();
        return name.includes(query) || caption.includes(query) || folder.includes(query);
      });

      renderList();
    }

    // Render Video Card List
    function renderList() {
      if (filteredItems.length === 0) {
        itemsContainer.innerHTML = '<div class="empty-state">لا توجد مقاطع مطابقة.</div>';
        return;
      }

      const currentItem = currentIndex !== -1 ? filteredItems[currentIndex] : null;

      let html = '';
      filteredItems.forEach((item, index) => {
        const isPlaying = currentItem && currentItem.path === item.path;
        const cleanTitle = escapeHtml(item.name.replace(/\.[^/.]+$/, ""));
        const folderName = escapeHtml(item.folder_name || 'الرئيسية');
        const sizeStr = formatBytes(item.size);

        html += `
          <div class="video-card ${isPlaying ? 'playing' : ''}" data-index="${index}" data-path="${escapeHtml(item.path)}">
            <div class="card-info">
              <div class="card-title">${cleanTitle}</div>
              <div class="card-meta">
                <span class="badge cyan">${folderName}</span>
                <span>${sizeStr}</span>
              </div>
            </div>
            <div class="card-actions">
              <button class="card-btn play" title="تشغيل" data-play-index="${index}">
                ▶ تشغيل
              </button>
              <button class="card-btn download" title="تحميل" data-dl-index="${index}">
                ⬇
              </button>
            </div>
          </div>
        `;
      });

      itemsContainer.innerHTML = html;

      // Event delegation for cards
      itemsContainer.querySelectorAll('.video-card').forEach(card => {
        card.addEventListener('click', (e) => {
          if (e.target.closest('.card-btn.download')) {
            const idx = parseInt(e.target.closest('.card-btn.download').dataset.dlIndex, 10);
            downloadVideo(filteredItems[idx]);
            return;
          }
          const idx = parseInt(card.dataset.index, 10);
          playVideo(idx);
        });
      });
    }

    // Search input handler
    searchInput.addEventListener('input', () => {
      searchClearBtn.style.display = searchInput.value ? 'block' : 'none';
      applyFilter();
    });

    searchClearBtn.addEventListener('click', () => {
      searchInput.value = '';
      searchClearBtn.style.display = 'none';
      applyFilter();
    });

    // Refresh button
    refreshBtn.addEventListener('click', () => {
      fetchMedia();
    });

    // Settings Modal Handlers
    settingsBtn.addEventListener('click', () => {
      serverHostInput.value = activeServer;
      settingsModal.classList.add('open');
    });

    closeServerBtn.addEventListener('click', () => {
      settingsModal.classList.remove('open');
    });

    resetServerBtn.addEventListener('click', () => {
      serverHostInput.value = DEFAULT_DIRECT_SERVER;
    });

    saveServerBtn.addEventListener('click', () => {
      const val = serverHostInput.value.trim().replace(/\/+$/, '');
      if (val) {
        activeServer = val;
        localStorage.setItem('tc_server', activeServer);
        settingsModal.classList.remove('open');
        showToast('تم حفظ عنوان السيرفر');
        fetchMedia();
      }
    });

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/[&<>"']/g, m => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      }[m]));
    }

    // Initial Load
    fetchMedia();
  </script>
</body>
</html>
